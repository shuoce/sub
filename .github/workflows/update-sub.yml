name: Update Nodes

on:
  schedule:
    # GitHub cron 仅支持 UTC（原 timezone 键为无效语法，北京时间 0/6/12/18 点 = UTC 前一小时偏移已校准）
    # 每 3 小时: UTC 0 */3 * * *
    - cron: '0 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-sub
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          # 不开 cache: 'pip' —— 仓库无 requirements.txt，缓存依赖查找会直接报错
          # ("No file ... matched to ...")

      - name: Install deps
        run: pip install pyyaml

      - name: Fetch nodes
        env:
          SUB_TOKEN: ${{ secrets.SUB_TOKEN }}
          SUB_AUTHTOKEN: ${{ secrets.SUB_AUTHTOKEN }}
        run: python fetch_nodes.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add nodes.txt nodes_new.txt sub.txt clash.yaml share/a.txt share/clash.yaml

          if git diff --cached --quiet; then
            echo "节点无变化，跳过提交"
          else
            git commit -m "自动更新节点 $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
