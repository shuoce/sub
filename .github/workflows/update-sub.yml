name: Update Nodes

on:
  schedule:
    # GitHub cron 仅支持 UTC（原 timezone 键为无效语法，北京时间 0/6/12/18 点 = UTC 前一小时偏移已校准）
    # 每 3 小时: UTC 0 */3 * * *
    - cron: '0 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-sub
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          # 不开 cache: 'pip' —— 仓库无 requirements.txt，缓存依赖查找会直接报错
          # ("No file ... matched to ...")

      - name: Install deps
        run: pip install pyyaml

      - name: Install probe tools
        run: |
          curl -sL -o /tmp/ss.tar.xz https://github.com/shadowsocks/shadowsocks-rust/releases/download/v1.25.0/shadowsocks-v1.25.0.x86_64-unknown-linux-gnu.tar.xz
          tar -xJf /tmp/ss.tar.xz -C /usr/local/bin sslocal
          curl -sL -o /tmp/v2.tgz https://github.com/shadowsocks/v2ray-plugin/releases/download/v1.3.2/v2ray-plugin-linux-amd64-v1.3.2.tar.gz
          tar -xzf /tmp/v2.tgz -C /tmp
          mv /tmp/v2ray-plugin_linux_amd64 /usr/local/bin/v2ray-plugin
          chmod +x /usr/local/bin/sslocal /usr/local/bin/v2ray-plugin

      - name: Verify trial nodes
        run: python verify_nodes.py

      - name: Fetch nodes
        env:
          SUB_TOKEN: ${{ secrets.SUB_TOKEN }}
          SUB_AUTHTOKEN: ${{ secrets.SUB_AUTHTOKEN }}
        run: python fetch_nodes.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          # 只提交产物；local_probe.py（本机脚本）与 share/alive.txt 的人工刷新
          # 不在此列 —— alive.txt 由本机 local_probe.py 生成后手动推送
          git add nodes.txt nodes_new.txt sub.txt clash.yaml share/a.txt share/clash.yaml share/refresh.txt refresh_nodes_uris.txt

          if git diff --cached --quiet; then
            echo "节点无变化，跳过提交"
          else
            git commit -m "自动更新节点 $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
